<imx-icon-tile
  data-imx-identifier="import-a-csv-file"
  [caption]="'#LDS#Bulk Actions' | translate"
  [subtitle]="'#LDS#Make bulk actions to the database.' | translate"
  [image]="'database'"
  [identifier]="'import-a-csv-file'"
  *ngIf="functionObjectsCount > 0"
>
  <ng-template #ActionTemplate>
    <button mat-button color="primary" (click)="GoToCSVsync()">
      <span>{{ '#LDS#Import a CSV file' | translate }}</span>
      <eui-icon size="m" icon="forward"></eui-icon>
    </button>
  </ng-template>
</imx-icon-tile>
